# Pipeline de test (semaine 2) : lit les fichiers JSON Lines déposés dans uploads/
# et les envoie dans Elasticsearch. Le pipeline CSV sera ajouté en semaine 3.

input {
  file {
    path => "/usr/share/logstash/uploads/*.json"
    codec => "json_lines"
    start_position => "beginning"
    sincedb_path => "/dev/null"   # relit les fichiers à chaque démarrage (pratique en développement)
  }
}

filter {
  mutate {
    remove_field => ["log", "event", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
}
